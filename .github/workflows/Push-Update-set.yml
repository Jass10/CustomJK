name: Prepare ServiceNow Update Set for Target

on:
  workflow_dispatch:
    inputs:
      update_set_folder:
        description: 'Folder name under servicenow/update-sets/ (copy it from the repository)'
        required: true

jobs:
  prepare:
    runs-on: ubuntu-latest
    environment: servicenow-prod      # Requires reviewers approval before the job runs
    timeout-minutes: 15
    concurrency:
      group: servicenow-deploy-prod
      cancel-in-progress: false
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Locate and validate update set XML
        env:
          FOLDER: ${{ inputs.update_set_folder }}
        run: |
          DIR="servicenow/update-sets/$FOLDER"
          if [ ! -d "$DIR" ]; then
            echo "Folder not found: $DIR"
            exit 1
          fi

          COUNT=0
          for FILE in "$DIR"/*.xml; do
            [ -e "$FILE" ] || continue
            COUNT=$((COUNT+1))
            # Fail the run if any XML file is not well formed
            python3 -c "import sys, xml.etree.ElementTree as ET; ET.parse(sys.argv[1])" "$FILE" \
              || { echo "Invalid XML: $FILE"; exit 1; }
          done

          if [ "$COUNT" -eq 0 ]; then
            echo "No XML files found in $DIR"
            exit 1
          fi
          echo "Validated $COUNT XML file(s) in $DIR"

      - name: Check target instance variable
        env:
          TARGET_SNOW_INSTANCE: ${{ vars.TARGET_SNOW_INSTANCE }}
        run: |
          echo "Value received: [${TARGET_SNOW_INSTANCE}]"
          echo "Length: ${#TARGET_SNOW_INSTANCE}"

          if [ -z "$TARGET_SNOW_INSTANCE" ]; then
            echo "TARGET_SNOW_INSTANCE is not set. Create it under Settings > Secrets and variables > Actions > Variables."
            exit 1
          fi

          case "$TARGET_SNOW_INSTANCE" in
            *.service-now.com*|https://*)
              echo "TARGET_SNOW_INSTANCE should be the instance name only, for example dev67890."
              exit 1 ;;
          esac

          echo "Target instance check passed"

      - name: Get target access token
        env:
          TARGET_SNOW_INSTANCE: ${{ vars.TARGET_SNOW_INSTANCE }}
          TARGET_SNOW_CLIENT_ID: ${{ secrets.TARGET_SNOW_CLIENT_ID }}
          TARGET_SNOW_CLIENT_SECRET: ${{ secrets.TARGET_SNOW_CLIENT_SECRET }}
          TARGET_SNOW_USERNAME: ${{ secrets.TARGET_SNOW_USERNAME }}
          TARGET_SNOW_PASSWORD: ${{ secrets.TARGET_SNOW_PASSWORD }}
        run: |
          RESPONSE=$(curl -s -X POST "https://${TARGET_SNOW_INSTANCE}.service-now.com/oauth_token.do" \
            -H "Content-Type: application/x-www-form-urlencoded" \
            --data-urlencode "grant_type=password" \
            --data-urlencode "client_id=${TARGET_SNOW_CLIENT_ID}" \
            --data-urlencode "client_secret=${TARGET_SNOW_CLIENT_SECRET}" \
            --data-urlencode "username=${TARGET_SNOW_USERNAME}" \
            --data-urlencode "password=${TARGET_SNOW_PASSWORD}")

          TOKEN=$(echo "$RESPONSE" | jq -r '.access_token')
          if [ "$TOKEN" = "null" ] || [ -z "$TOKEN" ]; then
            echo "Target token request failed:"
            echo "$RESPONSE" | jq -r '.error_description // .error // "unknown error"'
            exit 1
          fi
          echo "::add-mask::$TOKEN"
          echo "Target authentication succeeded"

      - name: Package files for manual import
        env:
          FOLDER: ${{ inputs.update_set_folder }}
        run: |
          mkdir -p import-package
          cp -r "servicenow/update-sets/$FOLDER" "import-package/$FOLDER"
          cp servicenow/update-sets/README.md import-package/ 2>/dev/null || true

      - name: Upload import package
        uses: actions/upload-artifact@v4
        with:
          name: import-package-${{ inputs.update_set_folder }}
          path: import-package/
          retention-days: 14

      - name: Summary
        env:
          FOLDER: ${{ inputs.update_set_folder }}
        run: |
          {
            echo "## Import package ready"
            echo ""
            echo "Folder: \`$FOLDER\`"
            echo ""
            echo "Next step (manual import): download the artifact, then on the target instance go to"
            echo "System Update Sets > Retrieved Update Sets > Import Update Set from XML, upload the XML,"
            echo "preview the set, and commit it after reviewing conflicts."
          } >> "$GITHUB_STEP_SUMMARY"
